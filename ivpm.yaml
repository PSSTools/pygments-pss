package:
  name: pygments-pss

  # A bare `ivpm update` must resolve the *development* set. The grammar that
  # scripts/gen_keywords.py and tests/test_vocabulary_sync.py read lives only in
  # `default-dev`, because it is a development dependency and has no business in
  # a runtime set (DESIGN.md section 4.4).
  #
  # Without this, a fresh checkout -- CI, or a new contributor -- gets the
  # `default` set, no pssparser, and a drift guard that fails for a reason that
  # has nothing to do with the vocabulary. A working copy hides it: once
  # `ivpm update -d default-dev` has run, `packages/ivpm.json` remembers the
  # choice and every later bare `ivpm update` keeps using it.
  default-dep-set: default-dev

  dep-sets:
  - name: default
    deps:
    - name: pygments
      src: pypi
    - name: pytest
      src: pypi

  - name: default-dev
    deps:
    - name: pygments
      src: pypi
    - name: pytest
      src: pypi
    # Documentation build (docs/ dogfoods the lexer, so a docs build is a
    # real regression signal -- plan section 4).
    - name: sphinx
      src: pypi
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    # The shared .pss corpus (pss-corpus/PLAN.md). Test data: `type: raw`
    # because there is nothing to build and nothing to install.
    #
    # This repo was the donor -- the corpus was vendored at tests/corpus/ until
    # Phase C3 moved it out (DESIGN.md section 8.1 records why). It is a hard
    # dependency of the suite now, not an optional one: the corpus sweep is the
    # primary signal, and it fails rather than skips when the corpus is absent.
    - name: pss-corpus
      url: https://git.dvkit.org/psstools/pss-corpus.git
      type: raw

    # Grammar source for scripts/gen_keywords.py (DESIGN.md section 5).
    # Development-only: _keywords.py is generated and checked in, so a
    # released wheel never needs pssparser. Fetched as source, not built --
    # only src/PSSLexer.g4 is read.
    - name: pssparser
      url: https://git.dvkit.org/psstools/pssparser.git
      type: raw

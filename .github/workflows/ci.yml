# CI for psstools/pygments-pss on GitHub Actions.
#
# CREATED 2026-09-09. This repo previously had NO .github/workflows at all,
# which is why sync-policy.toml pinned it to release_authority = "forgejo":
# under the estate default of "github" it would have had no release path, and
# the failure would have been silent -- a tag pushed, nothing published, and
# nothing red.
#
# THE UNIT OF CI IS THE PAIR. If .forgejo/workflows/ is absent the Forgejo
# runner falls back to running .github/workflows/, so a single unshadowed file
# is a hazard under a five-minute bidirectional sync. This file is the GitHub
# half of that pair; .forgejo/workflows/ci.yml is the other, and the two differ
# in exactly two things:
#
#   1. What `publish-pypi` compares the switch against -- 'github' here,
#      'forgejo' there. That is what makes exactly one of them fire per tag.
#   2. How interpreters are obtained. Forgejo cannot resolve
#      actions/setup-python, so it uses /opt/python from a manylinux container;
#      here setup-python is available and is used directly.
#
# Everything else -- the internal-identifier guard, the vocabulary drift check,
# the test matrix and every release-time assertion -- is deliberately identical,
# because whichever forge holds authority, the same guarantee has to hold.
name: CI

on:
  push:
    branches: [main]
    # Tags are load-bearing: the `v*` tag IS the release trigger. A branch-gated
    # publisher would be satisfied by an ordinary sync cycle, since git-sync
    # moves the default branch -- mirroring must never be publishing.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Pygments floor from pyproject.toml. The floor leg is what catches
  # accidental use of a newer Pygments API (DESIGN.md section 8.5).
  PYGMENTS_FLOOR: "2.14.0"

jobs:
  # --------------------------------------------------------------------
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so `publish-pypi` below declares it.
  # --------------------------------------------------------------------
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # One line on purpose: a multi-line `python3 -c` has to start at column
        # 0, which terminates the YAML block scalar and silently corrupts the
        # workflow.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a non-tag ref; nothing to release"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # Guard: no internal identifiers, and the vocabulary matches its source.
  # --------------------------------------------------------------------
  vocabulary:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check for internal identifiers in tracked files
      # This repo is published, so anything committed here is public. Internal
      # host names, tailnet addresses and CGNAT-range IPs must not appear in
      # tracked files; if a build ever needs one, it belongs in a repository
      # secret, which is masked in logs.
      run: |
        pattern='\.ts\.net|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/ci.yml' ':!.github/workflows/ci.yml' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Install ivpm
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install ivpm

    - name: Configure ivpm dependency resolution
      # Kept identical to the .forgejo side rather than reverted to github.com
      # URLs. The remap is not a Forgejo workaround -- git.dvkit.org is the
      # publishing mirror and is the source of truth for these packages, so
      # resolving through it means both forges build from the same bits.
      run: |
        mkdir -p ~/.config/ivpm
        cat > ~/.config/ivpm/config.yaml <<'EOF'
        git-url-map:
          - from: "https://github.com/mballance-utils/"
            to:   "https://git.dvkit.org/mballance-utils/"
          - from: "https://github.com/psstools/"
            to:   "https://git.dvkit.org/psstools/"
          - from: "https://github.com/fvutils/"
            to:   "https://git.dvkit.org/fvutils/"
        git-auth:
          - host: "git.dvkit.org"
            order: ["https"]
        EOF

    - name: Fetch the PSS grammar
      # Dev-only: scripts/gen_keywords.py and tests/test_vocabulary_sync.py read
      # packages/pssparser/src/PSSLexer.g4. The shipped wheel never needs it --
      # _keywords.py is generated and checked in.
      #
      # `-d default-dev` is not optional and not redundant with
      # `default-dep-set` in ivpm.yaml. The grammar is a development
      # dependency, so it is absent from the `default` set; a fresh checkout
      # that resolves `default` gets no pssparser and fails the drift guard for
      # a reason unrelated to the vocabulary.
      run: |
        python3 -m ivpm update -j 1 -a -d default-dev
        if [ ! -f packages/pssparser/src/PSSLexer.g4 ]; then
          echo "::error::ivpm update did not produce packages/pssparser/src/PSSLexer.g4."
          echo "Resolved packages:"
          ls -1 packages/ || true
          exit 1
        fi
        ls -l packages/pssparser/src/PSSLexer.g4

    - name: Check the generated vocabulary is in sync
      # Reports as itself: a pssparser keyword addition should read as
      # "regenerate _keywords.py", not as an opaque assertion failure.
      run: |
        python3 -m pip install "Pygments>=2.14" pytest
        python3 -m pip install .
        python3 scripts/gen_keywords.py --check
        python3 -m pytest tests -q -m upstream --tb=short

  # --------------------------------------------------------------------
  # The suite, one job per (interpreter, Pygments) pair.
  #
  # Same twelve legs as the .forgejo side, sourced from setup-python instead of
  # the manylinux image -- that is the only difference.
  # --------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every leg reports independently: one broken interpreter should not
      # hide the state of the other eleven.
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        pygments: ["floor", "latest"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Fetch the corpus
      # The suite's primary signal is a sweep over pss-corpus, which used to be
      # vendored at tests/corpus/ and is now a dependency (DESIGN.md 8.1). It is
      # a hard requirement: the suite fails rather than skips when it is absent,
      # because a sweep that finds no files and passes reports success in
      # exactly the case it exists to catch. So this step is load-bearing --
      # without it, every leg goes red at collection.
      #
      # A direct shallow clone rather than `ivpm update`, which is what this job
      # is structured to avoid: ivpm would also resolve pssparser and build a
      # dependency graph, for test data that has nothing to build.
      #
      # Not `--depth 1`: the transport in front of git.dvkit.org can fall back
      # to dumb http, which has no shallow capability and fails outright rather
      # than degrading to a full clone. The whole history is 324K, so the flag
      # was buying nothing worth a transport dependency.
      run: |
        set -eu
        git clone https://git.dvkit.org/psstools/pss-corpus.git packages/pss-corpus
        n=$(find packages/pss-corpus/curated -name '*.pss' | wc -l)
        echo "corpus: $n .pss files"
        if [ "$n" -lt 50 ]; then
          echo "::error::corpus resolved but looks wrong ($n files, expected 50+)"
          exit 1
        fi

    - name: Run the suite
      # The drift guard needs pssparser's grammar, which this job deliberately
      # does not fetch; it runs once in the `vocabulary` job instead. Hence
      # `-m "not upstream"`.
      run: |
        set -eu
        if [ "${{ matrix.pygments }}" = "floor" ]; then
          PYG="Pygments==${PYGMENTS_FLOOR}"
        else
          PYG="Pygments"
        fi
        echo "installing ${PYG}"
        python -m pip install --upgrade pip
        python -m pip install ".[test]" "${PYG}"
        python -c "import pygments; print('pygments', pygments.__version__)"
        python -m pytest tests -m "not upstream" -q --tb=short

  # --------------------------------------------------------------------
  # Release. Tag-gated AND switch-gated: a version number on PyPI can be yanked
  # but never reused, so an ordinary push must not be able to reach this, and
  # neither must the other forge for the same tag.
  # --------------------------------------------------------------------
  publish-pypi:
    # BOTH CLAUSES ARE LOAD-BEARING.
    #
    #   refs/tags/v*   this repo is mirrored to Forgejo and back on a five-minute
    #                  cron, and git-sync moves the DEFAULT BRANCH. A branch-gated
    #                  publisher is therefore satisfied by a sync cycle -- mirroring
    #                  would be a release trigger. A tag is a deliberate act; a
    #                  cycle never creates one.
    #
    #   authority      the release-authority master switch. Its counterpart in
    #                  .forgejo/workflows/ci.yml tests for 'forgejo', so exactly
    #                  one of the two can fire for any given tag.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.gate.outputs.authority == 'github'
    needs: [gate, vocabulary, test]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check the tag matches the package version
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(grep '^BASE = ' src/pygments_pss/__version__.py | sed 's/.*"\(.*\)".*/\1/')
        echo "tag=$tag  BASE=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match BASE $base in src/pygments_pss/__version__.py"
          exit 1
        fi

    - name: Build the wheel and sdist
      # Pure Python: one universal wheel plus an sdist, no per-interpreter
      # matrix and no auditwheel repair (DESIGN.md section 4.4).
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install build twine
        python3 -m build
        ls -l dist/
        python3 -m twine check dist/*

    - name: Install the built wheel into a clean venv and smoke-test it
      # The entry point is packaging metadata; only an install from the built
      # artifact proves it survived the build.
      run: |
        python3 -m venv /tmp/relcheck
        /tmp/relcheck/bin/python -m pip install dist/*.whl
        echo 'component pss_top { action entry {} }' > /tmp/smoke.pss
        /tmp/relcheck/bin/python -m pygments -l pss /tmp/smoke.pss
        /tmp/relcheck/bin/python -c "from pygments.lexers import get_lexer_by_name; print(get_lexer_by_name('pss'))"

    - name: Publish to PyPI
      # Plain twine rather than pypa/gh-action-pypi-publish, matching the
      # .forgejo side step for step. PYPI_API_TOKEN is an organization secret
      # on psstools.
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not visible to this job"
          exit 1
        fi
        # Idempotence net: with one switch and two possible publishers, a
        # misconfiguration should cost a no-op rather than a hard failure.
        python3 -m twine upload --non-interactive --skip-existing dist/*
